name: Bump formulae

# Polls upstream every six hours (UTC), and can also be triggered instantly by the
# upstream release workflow via repository_dispatch.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      formula:
        description: "Only check this formula, e.g. ds (blank checks all)"
        required: false
        type: string
  repository_dispatch:
    # Accepts an optional client_payload.formula, so an upstream release can
    # name the one formula it affects.
    types: [upstream-release]

concurrency:
  group: bump-formulae
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check upstream releases
        id: bump
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORMULA: ${{ inputs.formula || github.event.client_payload.formula }}
        run: |
          if [ -n "$FORMULA" ]; then
            python3 scripts/bump-formulae.py --formula "$FORMULA"
          else
            python3 scripts/bump-formulae.py
          fi

      - name: Check the formulae still parse
        if: steps.bump.outputs.changed == 'true'
        run: for f in Formula/*.rb; do ruby -c "$f"; done

      - name: Commit
        if: steps.bump.outputs.changed == 'true'
        env:
          SUMMARY: ${{ steps.bump.outputs.summary }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "$SUMMARY"
          git push
